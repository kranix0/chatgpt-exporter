name: PR410 exact-source manual validation

# Install this workflow on the fork's DEFAULT branch while Actions are disabled.
# It is not runnable from a feature branch alone.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-character SHA of the prepared PR410 source candidate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr410-manual-validation
  cancel-in-progress: true

jobs:
  validate:
    # Prevent execution outside the designated public fork and its default branch.
    if: github.repository == 'kranix0/chatgpt-exporter' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate exact candidate identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          if ! [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Expected a full lowercase Git commit SHA' >&2
            exit 2
          fi

      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Confirm candidate commit
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.14.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck and tests
        run: pnpm run test

      - name: Production build
        run: pnpm run build

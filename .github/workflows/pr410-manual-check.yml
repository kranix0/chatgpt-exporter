name: PR410 exact-source manual validation

# Install this workflow on the fork's DEFAULT branch while Actions are disabled.
# It is not runnable from a feature branch alone.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-character SHA of the prepared PR410 source candidate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr410-manual-validation
  cancel-in-progress: true

jobs:
  validate:
    # Prevent execution outside the designated public fork and its default branch.
    if: github.repository == 'kranix0/chatgpt-exporter' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate exact candidate identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          if ! [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Expected a full lowercase Git commit SHA' >&2
            exit 2
          fi
          if [[ "$CANDIDATE_SHA" != '96dc5c4c8e2ea71b28289bbcf0df8dc43e43bf24' ]]; then
            echo 'This pilot is restricted to the verified PR410 three-file candidate' >&2
            exit 2
          fi

      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Confirm candidate commit
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.14.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck and tests
        run: pnpm run test

      - name: Production build
        run: pnpm run build

      - name: Identify built userscript
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          test -s dist/chatgpt.user.js
          printf '%s\n' "$CANDIDATE_SHA" > dist/SOURCE_COMMIT.txt
          sha256sum dist/chatgpt.user.js > dist/SOURCE_SHA256.txt

      - name: Retain exact userscript for personal UAT
        uses: actions/upload-artifact@v4
        with:
          name: pr410-threefile-uat-96dc5c4
          path: |
            dist/chatgpt.user.js
            dist/SOURCE_COMMIT.txt
            dist/SOURCE_SHA256.txt
          if-no-files-found: error
          retention-days: 7
